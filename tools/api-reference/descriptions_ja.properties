MinecraftRemote=接続・ブロック・看板・イベントなどを操作する同期クライアント。
MinecraftRemote.builder=接続先のhostとTCP portを指定し、接続の設定を始めます。接続はconnect()で行います。
MinecraftRemote.helloResult=接続時にサーバーから受け取った対応版、次元、原点、権限などを読みます。
MinecraftRemote.helloResult.wire=hello
MinecraftRemote.buildContext=この接続で現在使う次元と建築原点を読みます。追加の通信はしません。
MinecraftRemote.setOrigin=以後の操作の建築原点を絶対座標で変更し、サーバーが返すBuildContextを返します。プレイヤーは移動しません。
MinecraftRemote.setOrigin.wire=build.setOrigin
MinecraftRemote.postToChat=メッセージを送り、サーバーの成功応答を待ちます。成功resultがnullであることを検証します。
MinecraftRemote.postToChat.wire=chat.post
MinecraftRemote.setBlock=原点から相対の整数座標に1ブロックを設置します。BlockSpecの省略したstateはMinecraftの既定値になります。成功応答まで待ちます。
MinecraftRemote.setBlock.wire=world.setBlock
MinecraftRemote.setBlocks=2点を両端に含む直方体を同じBlockSpecで埋めます。1回の設置数や処理量の上限はサーバー側で判定されます。
MinecraftRemote.setBlocks.wire=world.setBlocks
MinecraftRemote.getBlock=原点から相対の整数座標から、完全修飾IDと正準stateを持つBlockValueを読みます。
MinecraftRemote.getBlock.wire=world.getBlock
MinecraftRemote.getCatalog=接続先で使えるblockのstate定義、entityとparticleのID集合を取得します。接続時の自動生成やIDE用定数ファイルの生成は行いません。
MinecraftRemote.getCatalog.wire=catalog.get
MinecraftRemote.getPlayerPose=paired playerの現在の次元、原点から相対の位置、yawとpitchを読みます。
MinecraftRemote.getPlayerPose.wire=player.getPose
MinecraftRemote.setPlayerPose=paired playerを指定の次元・原点相対位置・向きへ移動し、サーバーが返す正準poseを返します。dimensionは完全修飾IDを使います。
MinecraftRemote.setPlayerPose.wire=player.setPose
MinecraftRemote.spawnParticle=dataを必要としないparticleを原点相対位置へ発生させ、受理されたcountを返します。offsetとspeedは有限の非負数、countは非負整数。forceを省略するとtrueです。IDは完全修飾で指定します。typed dataやreceiverの引数はまだありません。
MinecraftRemote.spawnParticle.wire=world.spawnParticle
MinecraftRemote.getSign=原点相対位置の看板の表裏4行とwax状態を読みます。
MinecraftRemote.getSign.wire=world.getSign
MinecraftRemote.setSign=指定した面の4行を置き換えます。front、back、bothのいずれかのSign.Contentを渡します。看板ブロック自体の設置はsetBlockで行います。
MinecraftRemote.setSign.wire=world.setSign
MinecraftRemote.updateSignLine=指定した面の1行を置き換えます。lineIndexは0〜3です。
MinecraftRemote.updateSignLine.wire=world.updateSignLine
MinecraftRemote.pollEvents=afterSequenceより後のeventを有限件取得します。次の呼び出しにはthroughSequence()を渡します。maxEventsは正整数。新しい互換minorの未知eventは省略し、cursorとloss counterは保持します。自動監視は始めません。
MinecraftRemote.pollEvents.wire=events.poll
MinecraftRemote.close=TCP接続を閉じます。try-with-resourcesで呼べます。繰り返し閉じても構いません。
MinecraftRemote.Builder=接続前のtimeout・認証・pairingを設定するビルダー。
MinecraftRemote.Builder.connectTimeout=TCP接続のtimeoutを設定します。既定は10秒です。
MinecraftRemote.Builder.readTimeout=通常requestの応答を待つtimeoutを設定します。既定は10秒です。
MinecraftRemote.Builder.pairPollInterval=pairing承認を確認する間隔を設定します。既定は1500ミリ秒です。timeoutと間隔はいずれも正のDurationを渡します。
MinecraftRemote.Builder.credentialStore=接続先ごとにtokenを読み書きする保存先を指定します。既定はnone()で保存しません。
MinecraftRemote.Builder.pairingListener=pairingが必要なとき、コマンドを利用者へ示す処理を登録します。未設定ならPairingRequiredExceptionになります。
MinecraftRemote.Builder.tokenType=pairingで要求するtoken種別を指定します。通常は既定のSESSIONを使います。
MinecraftRemote.Builder.clientIdentity=pairing画面へ渡すapplication名・版・localeを設定します。
MinecraftRemote.Builder.connect=TCP接続、hello、互換判定、必要な認証とpairingを進め、利用可能なMinecraftRemoteを返します。失敗時は接続を閉じます。
MinecraftRemote.Builder.connect.wire=hello / auth.pairBegin / auth.pairPoll
BlockPosition=整数の位置。BuildContextの建築原点は絶対座標、event内のpositionはeventの原点からの相対座標です。
BlockSpec=設置するブロックIDとstate。stateはMapで指定し、省略したpropertyは既定値になります。
BlockSpec.of=IDだけ、またはIDとstateから入力値を作ります。例: BlockSpec.of("minecraft:oak_log", Map.of("axis", "x"))。
BlockValue=読み取ったブロックの完全修飾IDと正準state。ブロックentityの追加データは含みません。
BuildContext=この接続の次元と絶対座標の建築原点。
Catalog=接続先のblock定義、entityとparticleのID集合、catalogHash。
Catalog.BlockEntry=blockの各state propertyの許容値と既定state。
ClientIdentity=pairing時に表示するapplication名・版・locale。
ClientIdentity.defaultIdentity=このJavaクライアントの既定identityを作ります。公開版が無いcheckoutの版はdevelopmentです。
CredentialStore=接続先単位でtokenを扱うSPI。永続化するapplicationは保護された保存先を実装します。
CredentialStore.load=指定接続先のtokenを読みます。無いときはOptional.empty()を返します。
CredentialStore.save=指定接続先のtokenを保存します。
CredentialStore.clear=指定接続先のlocal tokenを削除します。サーバー側のrevokeやlogoutではありません。
CredentialStore.none=tokenを保存しない実装を作ります。coreの既定値です。
CredentialStore.inMemory=同じstoreを渡した接続間でprocess内のtokenを再利用します。process終了で失われます。
EventPollResult=eventの有限snapshot。throughSequenceが次回cursorで、3つのloss counterは接続epoch内の累積値です。
HelloResult=サーバーが返した接続情報。省略されたsession、player、serverなどは空のOptionalになります。
MinecraftEvent=ツルハシ・チャット・飛翔体のevent。発生時の次元と原点を保持します。
MinecraftEvent.sequence=この接続epoch内のsequenceを返します。
MinecraftEvent.dimension=event発生時の完全修飾DimensionKeyを返します。
MinecraftEvent.origin=event発生時の建築原点を返します。現在の原点と一致するとは限りません。
MinecraftEvent.Hand=eventの対象となる利き手または逆手。
MinecraftEvent.Hand.wireName=通信上の手の識別文字列を返します。
MinecraftEvent.PickaxePoke=ツルハシを持ったblock右クリックの情報。
MinecraftEvent.ChatPosted=paired playerが投稿したチャットの情報。
MinecraftEvent.ProjectileHit=飛翔体の衝突位置と対象。
MinecraftEvent.ProjectileTarget=飛翔体が当たったplayer・entity・blockの型。
MinecraftEvent.PlayerTarget=衝突対象がplayerであることだけを示します。
MinecraftEvent.EntityTarget=衝突対象の接続epochに属するentity handle。
MinecraftEvent.BlockTarget=衝突対象blockの値・位置・任意の面。
MinecraftRemoteException=接続・通信・サーバーの拒否に共通するchecked exception。
PairingChallenge=ゲーム内でpairingを承認するためのコードと有効期限。
PairingChallenge.command=Minecraftのチャットへ貼り付けるpairingコマンドを返します。
PairingListener=pairingが必要なときに呼ばれるコールバック。
PairingListener.pairingRequired=challenge.command()などを利用者へ表示します。その後、接続処理が承認をpollします。
PairingRequiredException=認証が必要ですがpairingListenerが設定されていない状態。
PairingRequiredException.reason=pairingが必要になった認証reasonを返します。
PlayerPose=paired playerの完全修飾次元、原点相対位置、yaw・pitch。
ProtocolException=互換性や応答の形がJavaクライアントの受理条件に合わない状態。
RemoteCallException=サーバーがJSON-RPC errorで操作を拒否した状態。reason()で拒否理由を調べます。
RemoteCallException.code=サーバーの数値error codeを返します。
RemoteCallException.remoteMessage=サーバーのerror messageを返します。
RemoteCallException.data=reasonや拒否の詳細を含むerror dataを返します。公開logへ写す前に内容を確認してください。
RemoteCallException.reason=error dataにreasonがあるとき返します。
ServerTarget=TCP接続先のhostとport。CredentialStoreのscopeにも使います。
ServerTarget.credentialKey=接続先を含む識別文字列です。秘密情報を隠すhashではありません。
Sign=看板の入力・戻り値・面・装飾をまとめる型。
Sign.Face=看板の前面または背面。
Sign.Face.wireName=通信上の面の名前を返します。
Sign.Decoration=文字の装飾。戻り値はこの宣言順へ正準化されます。
Sign.Decoration.wireName=通信上の装飾名を返します。
Sign.LineSpec=書き込む1行。文字列・任意の色・装飾を指定します。
Sign.LineSpec.plain=装飾しない行を作ります。
Sign.LineSpec.styled=色と任意の装飾を持つ行を作ります。色はgold、aqua等の名前、または#RRGGBB形式です。
Sign.LineSpec.decorated=色を指定せず装飾だけを付けた行を作ります。
Sign.LineSpec.isPlain=色と装飾をどちらも指定していないか返します。
Sign.LineValue=読み取った1行の文字列・正準色・装飾。
Sign.Content=1面または両面の書き込み。指定した面にはちょうど4行が必要です。
Sign.Content.front=前面の4行を指定します。背面は変更しません。
Sign.Content.back=背面の4行を指定します。前面は変更しません。
Sign.Content.both=両面それぞれの4行を指定します。
Sign.Value=読み取った両面各4行とwax状態。
TokenType=認証tokenの種別。通常はSESSIONを使います。LONG_LIVEDのenum値の存在は、long-lived credentialの一般公開や推奨を意味しません。
TransportException=接続・切断・送受信・timeoutの失敗。操作が実行されたか不明な場合があるため自動再実行しません。
Vec3=有限の小数を持つ位置またはベクトル。
