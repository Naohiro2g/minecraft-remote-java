name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [21, 25]
    env:
      MISE_JAVA_VERSION: ${{ matrix.java }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up mise and Java
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.25
          cache_key: "{{default}}-java${{ matrix.java }}"

      - name: Check Java
        run: |
          mise --version
          mise exec -- java -version
          mise exec -- javac -version

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: mise exec -- ./gradlew build --no-daemon
